name: Deploy Telegram Serverless

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tgcloud-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy Serverless
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build VPS bundle
        run: pnpm build

      - name: Build Serverless modules
        run: pnpm build:serverless

      - name: Check Serverless deployment configuration
        id: serverless
        shell: bash
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          if [[ -n "$TGCLOUD_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "TGCLOUD_TOKEN is configured; Serverless deployment is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "TGCLOUD_TOKEN is not configured; skipping Serverless deployment."
          fi

      - name: Install tgcloud CLI
        if: steps.serverless.outputs.enabled == 'true'
        run: npm install --global @tgcloud/cli@0.2.0

      - name: Verify tgcloud CLI
        if: steps.serverless.outputs.enabled == 'true'
        run: tgcloud --version

      - name: Fetch remote tgcloud snapshot
        if: steps.serverless.outputs.enabled == 'true'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: tgcloud fetch

      - name: Deploy Serverless modules
        if: steps.serverless.outputs.enabled == 'true'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: tgcloud push
